name: temporary-mai-100-rendered-review
on:
  workflow_dispatch:
jobs:
  rendered-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm --prefix gui ci
      - run: npx --prefix gui playwright install --with-deps chromium
      - run: npm --prefix gui run verify:deal-screens
      - run: npm --prefix gui run verify:screens
      - run: npm --prefix gui run verify:shell
      - run: npm --prefix gui run test:unit
      - run: npm --prefix gui run lint
      - run: npm --prefix gui run build
      - run: npm --prefix gui run build-storybook
      - run: npm --prefix gui run test-storybook
      - run: deno task verify
      - run: node scripts/mai-100-rendered-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mai-100-rendered-review
          path: tmp/mai-100-rendered-review
          if-no-files-found: error
