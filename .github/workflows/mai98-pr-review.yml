name: MAI-98 final-tree verification

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  verify-final-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm --prefix gui ci

      - name: Install Chromium
        working-directory: gui
        run: npx playwright install --with-deps chromium

      - name: Remove temporary review machinery from checkout
        run: |
          rm .github/workflows/mai98-pr-review.yml
          rm gui/scripts/mai98-bounded-review.mjs
          test ! -e .github/workflows/mai98-pr-review.yml
          test ! -e gui/scripts/mai98-bounded-review.mjs

      - name: Run final-tree canonical verification
        run: env -u MAI98_REVIEW_TEMP deno task verify
