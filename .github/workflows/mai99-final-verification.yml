name: MAI-99 final tree verification

on:
  push:
    branches:
      - feat/MAI-99-global-admin-external-screens

permissions:
  contents: read

jobs:
  verify-final-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Wait for workflow cleanup commit
        shell: bash
        run: |
          for attempt in {1..60}; do
            git fetch origin feat/MAI-99-global-admin-external-screens
            if ! git cat-file -e origin/feat/MAI-99-global-admin-external-screens:.github/workflows/mai99-final-verification.yml 2>/dev/null; then
              git checkout --detach origin/feat/MAI-99-global-admin-external-screens
              exit 0
            fi
            sleep 10
          done
          echo "Cleanup commit was not observed" >&2
          exit 1
      - name: Confirm exact final tree
        run: |
          test ! -e .github/workflows/mai99-final-verification.yml
          test ! -e gui/scripts/mai99-rendered-review.mjs
          test ! -e gui/scripts/mai99-rendered-corrections.mjs
          test -z "$(git diff master...HEAD -- .github/workflows)"
      - name: Install GUI dependencies
        run: npm --prefix gui ci
      - name: Run explicit final verification
        shell: bash
        run: |
          npm --prefix gui run tokens:check
          npm --prefix gui run verify:tokens
          npm --prefix gui run verify:components
          npm --prefix gui run verify:shell
          npm --prefix gui run verify:screens
          npm --prefix gui run verify:foundation
          npm --prefix gui run lint
          npm --prefix gui run test:unit
          npm --prefix gui run build
          npm --prefix gui run validate:storybook-docs
          npm --prefix gui run build-storybook
          npm --prefix gui run test-storybook
          deno task verify
