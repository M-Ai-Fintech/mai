name: MAI-101 temporary final proof
on:
  push:
    branches: [feat/MAI-101-deal-execution-agentic-screens]
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    env:
      VERIFIED_CANDIDATE_SHA: f5e43b375dcb8055a7ce55f810ebb968ec29e965
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cp scripts/mai101-final-review.mjs /tmp/mai101-final-review.mjs
      - name: Check out verified candidate
        run: |
          git checkout "${{ github.event.before }}"
          git branch -f master origin/master
          test "$(git rev-parse HEAD)" = "$VERIFIED_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gui/package-lock.json }
      - uses: denoland/setup-deno@v2
      - run: npx --prefix gui playwright install --with-deps chromium
      - name: Candidate canonical verification and rendered review
        run: |
          set -e -o pipefail
          mkdir -p mai101-evidence
          git diff master...HEAD --check |& tee mai101-evidence/diff-check.log
          npm --prefix gui ci |& tee mai101-evidence/npm-ci.log
          for command in 'tokens:check' 'verify:tokens' 'verify:components' 'verify:shell' 'verify:screens' 'verify:deal-screens' 'verify:execution-screens' 'verify:foundation' lint test:unit build validate:storybook-docs build-storybook test-storybook; do npm --prefix gui run "$command" |& tee "mai101-evidence/${command//:/-}.log"; done
          node /tmp/mai101-final-review.mjs |& tee mai101-evidence/rendered-review.log
          deno task verify |& tee mai101-evidence/canonical.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mai101-final-proof, path: mai101-evidence }
