name: MAI-100 one-shot finalizer

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MAI-100-deal-intelligence-decision-screens
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Patch focus-return ownership and remove finalizer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gui/screens/deal-intelligence/DealIntelligenceBody.tsx')
          text = path.read_text()
          replacements = {
              '  const [returnFocusRef, setReturnFocusRef] = useState(rowTrigger);\n  const openEvidence = (trigger: typeof rowTrigger) => {\n    setReturnFocusRef(trigger);\n    setOpen(true);\n  };':
              '  const [returnFocusTarget, setReturnFocusTarget] = useState<"row" | "inspector">("row");\n  const openEvidence = (target: "row" | "inspector") => {\n    setReturnFocusTarget(target);\n    setOpen(true);\n  };',
              'onClick={() => openEvidence(rowTrigger)}': 'onClick={() => openEvidence("row")}',
              'onClick={() => openEvidence(inspectorTrigger)}': 'onClick={() => openEvidence("inspector")}',
              'returnFocusRef={returnFocusRef}': 'returnFocusRef={returnFocusTarget === "row" ? rowTrigger : inspectorTrigger}',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git rm .github/workflows/mai100-finish.yml
          git config user.name "MAI delivery bot"
          git config user.email "actions@users.noreply.github.com"
          git add gui/screens/deal-intelligence/DealIntelligenceBody.tsx
          git commit -m "fix(MAI-100): preserve evidence focus return"
      - name: Install dependencies and Chromium once
        run: |
          npm --prefix gui ci
          npm --prefix gui exec -- playwright install --with-deps chromium
      - name: Verify exact final commit
        shell: bash
        run: |
          git branch -f master origin/master
          git diff --check
          git diff master...HEAD --check
          npm --prefix gui run tokens:check
          npm --prefix gui run verify:tokens
          npm --prefix gui run verify:components
          npm --prefix gui run verify:shell
          npm --prefix gui run verify:screens
          npm --prefix gui run verify:deal-screens
          npm --prefix gui run verify:foundation
          npm --prefix gui run lint
          npm --prefix gui run test:unit
          npm --prefix gui run build
          npm --prefix gui run validate:storybook-docs
          npm --prefix gui run build-storybook
          npm --prefix gui run test-storybook
          deno task verify
      - name: Push verified final commit
        run: git push origin HEAD:feat/MAI-100-deal-intelligence-decision-screens
