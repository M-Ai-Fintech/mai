name: Temporary MAI-98 shell review
on:
  push:
    branches:
      - "feat/MAI-98-app-shell-route-architecture"
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gui/package-lock.json }
      - run: npm --prefix gui ci
      - run: npm --prefix gui run build-storybook
      - run: npx --prefix gui playwright install --with-deps chromium
      - run: |
          cd gui/storybook-static
          python3 -m http.server 6006 >/tmp/storybook.log 2>&1 &
          cd ..
          node -e 'const { chromium }=require("playwright"); const fs=require("fs"); (async()=>{const b=await chromium.launch({headless:true}); const out=[]; for(const [id,w,h] of [["shell-appshell--global-desktop",1440,1100],["shell-appshell--deal-desktop",1024,1100],["shell-appshell--deal-mobile",390,844],["shell-appshell--external-participant",1440,1100],["shell-appshell--long-names-and-count-overflow",1024,1100],["shell-appshell--mobile-drawer-keyboard",390,844]]){const p=await b.newPage({viewport:{width:w,height:h}}); await p.goto(`http://127.0.0.1:6006/iframe.html?id=${id}`,{waitUntil:"networkidle"}); const m=await p.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,buttons:[...document.querySelectorAll("button")].map(x=>x.getBoundingClientRect().height)})); await p.screenshot({path:`review-${id}.png`,fullPage:true}); out.push({id,w,h,...m});} fs.writeFileSync("mai-98-layout-metrics.json",JSON.stringify(out,null,2)); await b.close();})().catch(e=>{console.error(e);process.exit(1)})'
      - uses: actions/upload-artifact@v4
        with: { name: mai-98-shell-review, path: gui/{review-*.png,mai-98-layout-metrics.json} }
