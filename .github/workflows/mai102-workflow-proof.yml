name: MAI-102 Final Workflow Proof

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAI_WORKFLOW_REPORT: mai102-evidence/workflow-report.json
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install GUI dependencies
        run: npm --prefix gui ci

      - name: Install repository-pinned Chromium
        run: npm --prefix gui exec -- playwright install --with-deps chromium

      - name: Record exact candidate
        shell: bash
        run: |
          mkdir -p mai102-evidence
          git rev-parse HEAD | tee mai102-evidence/candidate-sha.txt
          git rev-parse HEAD^{tree} | tee mai102-evidence/candidate-tree.txt
          git status --short | tee mai102-evidence/pre-verification-status.txt

      - name: Run complete canonical verification
        shell: bash
        run: |
          set -o pipefail
          deno task verify 2>&1 | tee mai102-evidence/deno-task-verify.log
          status=${PIPESTATUS[0]}
          printf 'EXIT_STATUS=%s\n' "$status" | tee -a mai102-evidence/deno-task-verify.log
          printf '%s\n' "$status" > mai102-evidence/canonical-exit-status.txt
          exit "$status"

      - name: Upload exact-head workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mai102-final-workflow-proof
          path: mai102-evidence
          if-no-files-found: error
          retention-days: 30
