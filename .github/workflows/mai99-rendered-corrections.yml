name: MAI-99 temporary rendered corrections

on:
  push:
    branches:
      - feat/MAI-99-global-admin-external-screens

permissions:
  contents: read

jobs:
  corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm --prefix gui ci
      - run: npm --prefix gui exec -- playwright install --with-deps chromium
      - name: Start corrected review surfaces
        run: |
          npm --prefix gui run build
          npm --prefix gui run start > /tmp/mai99-next.log 2>&1 &
          npm --prefix gui run storybook -- --ci -p 6006 > /tmp/mai99-storybook.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/deals >/dev/null &&
              curl --fail --silent http://127.0.0.1:6006 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Rerun affected views
        run: node gui/scripts/mai99-rendered-corrections.mjs
      - name: Upload correction evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mai99-rendered-corrections
          path: mai99-rendered-corrections
          if-no-files-found: error
      - name: Record artifact identity
        if: always()
        run: |
          echo "artifact-id=${{ steps.artifact.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact-digest=${{ steps.artifact.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for cleanup branch tip
        if: always()
        run: |
          for attempt in $(seq 1 60); do
            git fetch origin feat/MAI-99-global-admin-external-screens
            if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
              git checkout --detach FETCH_HEAD
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify exact final PR tree
        run: |
          test ! -e .github/workflows/mai99-rendered-corrections.yml
          test ! -e gui/scripts/mai99-rendered-corrections.mjs
          deno task verify
