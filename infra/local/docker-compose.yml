services:
  postgres-local:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${LOCAL_POSTGRES_DATABASE:-mai_local}
    ports:
      - "${LOCAL_POSTGRES_PORT:-55438}:5432"
    volumes:
      - mai-postgres-local-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${LOCAL_POSTGRES_USER:-postgres} -d $${LOCAL_POSTGRES_DATABASE:-mai_local}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["task", "api:start"]
    environment:
      DATABASE_URL: postgresql://${LOCAL_POSTGRES_USER:-postgres}:${LOCAL_POSTGRES_PASSWORD:-postgres}@postgres-local:5432/${LOCAL_POSTGRES_DATABASE:-mai_local}
      DENO_ENV: test
    ports:
      - "${LOCAL_API_PORT:-18000}:8000"
    depends_on:
      postgres-local:
        condition: service_healthy
    networks:
      - private
    init: true

  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["task", "worker:start"]
    environment:
      DATABASE_URL: postgresql://${LOCAL_POSTGRES_USER:-postgres}:${LOCAL_POSTGRES_PASSWORD:-postgres}@postgres-local:5432/${LOCAL_POSTGRES_DATABASE:-mai_local}
      MAI_WORKER_ID: ${LOCAL_WORKER_ID:-worker_local}
      MAI_WORKER_MODULE: ${LOCAL_WORKER_MODULE:-}
    depends_on:
      postgres-local:
        condition: service_healthy
    networks:
      - private
    init: true

networks:
  private:
    internal: true

volumes:
  mai-postgres-local-data:
