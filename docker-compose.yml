services:
  postgres-integration-test:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_INTEGRATION_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INTEGRATION_TEST_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_INTEGRATION_TEST_DATABASE:-mai_test_postgres_integration}
    ports:
      - "${POSTGRES_INTEGRATION_TEST_PORT:-55432}:5432"
    volumes:
      - mai-postgres-integration-test-data:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U $${POSTGRES_INTEGRATION_TEST_USER:-postgres} -d $${POSTGRES_INTEGRATION_TEST_DATABASE:-mai_test_postgres_integration}",
      ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mai-postgres-integration-test-data:
